<!DOCTYPE html>
<html>
<head>
    <title>Study Notes</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Anti-FOUC Theme Script (Immediate execution before paint) -->
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('ecet-prephub-theme');
                if (savedTheme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) {}
        })();
    </script>
    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
</head>
<body>
    <div class="auth-theme-toggle-corner" style="position: fixed; top: 1rem; right: 1rem; z-index: 1000;">
        <button class="theme-toggle-btn" id="themeToggleBtn" type="button" role="switch" aria-checked="false" aria-label="Switch to Night Mode" title="Switch to Night Mode">
            <span class="theme-toggle-slider">
                <span class="theme-toggle-indicator"></span>
                <span class="theme-toggle-option theme-option-light" aria-hidden="true">
                    <i class="fa-solid fa-sun"></i>
                </span>
                <span class="theme-toggle-divider" aria-hidden="true">/</span>
                <span class="theme-toggle-option theme-option-dark" aria-hidden="true">
                    <i class="fa-solid fa-moon"></i>
                </span>
            </span>
        </button>
    </div>
    
 <div id="page-loader"></div>
<h1 class="notes-title">📚 Study Notes</h1>

<div class="notes-container">

    <div class="note-card">
        <h2>☕ Java</h2>
        <a href="{{ url_for('static',
        filename='pdfs/notes/Java.pdf') }}"
        target="_blank">
            View Notes
        </a>
    </div>

    <div class="note-card">
        <h2>🌐 Web Technology</h2>
        <a href="{{ url_for('static',
        filename='pdfs/notes/Web_Technology.pdf') }}"
        target="_blank">
            View Notes
        </a>
    </div>

    <div class="note-card">
        <h2>💻 CN & CS</h2>
        <a href="{{ url_for('static',
        filename='pdfs/notes/CN_CS.pdf') }}"
        target="_blank">
            View Notes
        </a>
    </div>

    <div class="note-card">
        <h2>🔌 Digital Electronics</h2>
        <a href="{{ url_for('static',
        filename='pdfs/notes/Digital_Electronics.pdf') }}"
        target="_blank">
            View Notes
        </a>
    </div>

</div>
<script src="{{ url_for('static', filename='js/loader.js') }}"></script>
</body>
</html>
