<!DOCTYPE html>
<html>
<head>
    <title>PDF Viewer</title>
</head>
<body>

    <!-- Collapsible Left Sidebar -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <aside id="appSidebar" class="app-sidebar">
        <div class="sidebar-header">
            <div class="nav-left"><button class="hamburger-btn" onclick="toggleSidebar()" title="Open Navigation Menu"><i class="fa-solid fa-bars"></i></button><a href="{{ url_for('dashboard') }}" class="brand-logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>ECET <strong>PORTAL</strong></span>
            </a></div>
            <button class="btn-close-sidebar" onclick="toggleSidebar()">&times;</button>
        </div>

        <div class="sidebar-user-card">
            <div class="user-avatar"><i class="fa-solid fa-user-gear"></i></div>
            <div class="user-details">
                <span class="user-name">{{ session.get('student_name', 'Student') }}</span>
                <span class="user-branch-badge">{{ session.get('student_branch', 'cme')|upper }}</span>
            </div>
        </div>

        <nav class="sidebar-menu">
            <a href="{{ url_for('dashboard') }}"><i class="fa-solid fa-house"></i> Home</a>
            <a href="{{ url_for('notes') }}"><i class="fa-solid fa-book-open"></i> Notes & PDFs</a>
            <a href="{{ url_for('paper_branches') }}"><i class="fa-solid fa-file-pdf"></i> PYQs</a>
            <a href="{{ url_for('quiz') }}"><i class="fa-solid fa-pen-to-square"></i> CBT Quiz</a>
            <a href="{{ url_for('leaderboard') }}"><i class="fa-solid fa-trophy"></i> Ranks & Scores</a>
            <a href="{{ url_for('ai_tutor') }}"><i class="fa-solid fa-robot"></i> AI Tutor Hub</a>
            <a href="{{ url_for('ai_exam_setup') }}"><i class="fa-solid fa-file-signature"></i> AI Exam Preparator</a>
            <a href="{{ url_for('profile') }}"><i class="fa-solid fa-id-card"></i> Student Profile</a>
            <a href="javascript:void(0)" onclick="confirmLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </nav>
    </aside>

    <div id="page-loader"></div>

<h2>Study Notes</h2>

<iframe
    src="{{ url_for('static', filename=pdf_file) }}"
    width="100%"
    height="700px">
</iframe>

<br><br>

<a href="{{ url_for('static', filename=pdf_file) }}"
   download>
    <button>
        Download PDF
    </button>
</a>
<script src="{{ url_for('static', filename='js/loader.js') }}"></script>
</body>
</html>
